<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khmer PDF Editor</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="topbar">
  <div class="brand" data-i18n="appTitle">Khmer PDF Editor</div>
  <span id="lang-toggle">
    <button id="lang-en" class="tab active">English</button>
    <button id="lang-km" class="tab">ខ្មែរ</button>
  </span>
  <span id="theme-toggle">
    <button id="theme-light" class="tab" data-i18n-title="themeLightTitle" title="Light theme">☀</button>
    <button id="theme-dark" class="tab active" data-i18n-title="themeDarkTitle" title="Dark theme">🌙</button>
  </span>
  <nav id="mode-tabs" hidden>
    <button id="tab-edit" class="tab active" data-i18n="tabEdit">Edit</button>
    <button id="tab-pages" class="tab" data-i18n="tabPages">Pages</button>
  </nav>
  <div id="toolbar" hidden>
    <button id="btn-upload" data-i18n="btnUpload" data-i18n-title="btnUploadTitle" title="Open a different PDF (replaces the current document)">Open PDF</button>
    <span id="view-tools">
      <select id="view-mode" data-i18n-title="viewModeTitle" title="Page view">
        <option value="continuous" data-i18n="viewContinuous">Continuous</option>
        <option value="single" data-i18n="viewSingle">Single page</option>
        <option value="double" data-i18n="viewDouble">Double page</option>
      </select>
      <span class="zoom-group">
        <button id="zoom-out" data-i18n-title="zoomOutTitle" title="Zoom out">−</button>
        <button id="zoom-level" data-i18n-title="zoomResetTitle" title="Reset zoom to 100%">100%</button>
        <button id="zoom-in" data-i18n-title="zoomInTitle" title="Zoom in">+</button>
      </span>
      <span id="page-nav" hidden>
        <button id="page-prev" data-i18n-title="pagePrevTitle" title="Previous page">‹</button>
        <span id="page-indicator">1 / 1</span>
        <button id="page-next" data-i18n-title="pageNextTitle" title="Next page">›</button>
      </span>
    </span>
    <span id="edit-tools">
      <button id="btn-add-text" data-i18n="btnAddText" data-i18n-title="btnAddTextTitle" title="Add a text box (click a page to place)">+ Text</button>
      <button id="btn-add-image" data-i18n="btnAddImage" data-i18n-title="btnAddImageTitle" title="Insert an image (click a page to place)">+ Image</button>
      <button id="btn-add-signature" data-i18n="btnAddSignature" data-i18n-title="btnAddSignatureTitle" title="Draw or upload a signature">+ Signature</button>
      <button id="btn-add-highlight" data-i18n="btnAddHighlight" data-i18n-title="btnAddHighlightTitle" title="Highlight part of a page (drag to draw)">+ Highlight</button>
      <select id="ocr-lang" data-i18n-title="ocrLangTitle" title="OCR language">
        <option value="khm" data-i18n="ocrLangKhmer">Khmer</option>
        <option value="eng" data-i18n="ocrLangEnglish">English</option>
        <option value="khm+eng" data-i18n="ocrLangBoth">Khmer + English</option>
      </select>
      <button id="btn-ocr" data-i18n="btnOcr" data-i18n-title="btnOcrTitle" title="Recognize text on the current page with Khmer OCR">Recognize page</button>
      <button id="btn-ocr-area" data-i18n="btnOcrArea" data-i18n-title="btnOcrAreaTitle" title="Recognize text in a selected area (drag to select)">Recognize area</button>
    </span>
    <span id="pages-tools" hidden>
      <button id="btn-append-pdf" data-i18n="btnAppendPdf" data-i18n-title="btnAppendPdfTitle" title="Append pages from another PDF">+ Append PDF</button>
      <button id="btn-remove-pages" data-i18n="removeSelected" data-i18n-title="removeSelectedTitle" title="Remove selected pages" disabled>Remove selected</button>
    </span>
    <button id="btn-print" data-i18n="btnPrint" data-i18n-title="btnPrintTitle" title="Print the document">Print</button>
    <button id="btn-export" class="primary" data-i18n="btnExport" data-i18n-title="btnExportTitle" title="Download the modified PDF">Save PDF</button>
  </div>
</header>

<main id="main">
  <div id="dropzone">
    <div class="dz-inner">
      <p class="dz-title" data-i18n="dzTitle">Drop a PDF here</p>
      <p class="dz-sub" data-i18n="dzOr">or</p>
      <button id="btn-pick" data-i18n="btnPick">Choose a PDF file</button>
    </div>
  </div>
  <div id="hint-bar" hidden></div>
  <div id="edit-view" hidden></div>
  <div id="pages-view" hidden></div>
</main>

<input type="file" id="file-input" accept="application/pdf,.pdf" hidden>
<input type="file" id="append-input" accept="application/pdf,.pdf" hidden>
<input type="file" id="image-input" accept="image/png,image/jpeg" hidden>
<input type="file" id="sig-upload-input" accept="image/png" hidden>

<div id="sig-modal" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <span data-i18n="sigModalTitle">Signature</span>
      <button class="modal-close" data-close="sig-modal">&times;</button>
    </div>
    <canvas id="sig-canvas" width="500" height="200"></canvas>
    <div class="modal-actions">
      <button id="sig-clear" data-i18n="sigClear">Clear</button>
      <button id="sig-upload" data-i18n="sigUpload">Upload PNG instead</button>
      <button id="sig-use" class="primary" data-i18n="sigUse">Use signature</button>
    </div>
  </div>
</div>

<div id="ocr-modal" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <span id="ocr-modal-title" data-i18n="ocrModalTitle">Recognized text (Khmer)</span>
      <button class="modal-close" data-close="ocr-modal">&times;</button>
    </div>
    <div id="ocr-progress" hidden><div id="ocr-progress-bar"></div><span id="ocr-progress-label">Starting…</span></div>
    <textarea id="ocr-output" spellcheck="false" data-i18n-placeholder="ocrPlaceholder" placeholder="Recognized text will appear here."></textarea>
    <div class="modal-actions">
      <button id="ocr-copy" data-i18n="ocrCopy">Copy text</button>
    </div>
  </div>
</div>

<div id="busy" hidden><div class="spinner"></div><span id="busy-label">Working…</span></div>

<script src="vendor/pdf.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/tesseract.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
