<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khmer PDF Editor</title>
<link rel="icon" href="data:,">
<!-- Applies the theme before any CSS loads or paints, so there is no
     dark-then-light (or light-then-dark) flash on load. js/app.js's module
     script only runs after the document is parsed -- by then a flash would
     already have happened -- so this has to be an early, blocking, inline,
     classic script, not deferred module code. Dark is the default whenever
     nothing is saved yet. -->
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('pdfedit-theme'); } catch (e) {}
    document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark';
  })();
</script>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="topbar">
  <div class="brand" data-i18n="appTitle">Khmer PDF Editor</div>
  <span id="lang-toggle">
    <button id="lang-en" class="tab active">English</button>
    <button id="lang-km" class="tab">ខ្មែរ</button>
  </span>
  <span id="theme-toggle">
    <button id="theme-light" class="tab" data-i18n-title="themeLightTitle" title="Light theme">☀</button>
    <button id="theme-dark" class="tab active" data-i18n-title="themeDarkTitle" title="Dark theme">🌙</button>
  </span>
  <nav id="mode-tabs" hidden>
    <button id="tab-edit" class="tab active" data-i18n="tabEdit">Edit</button>
    <button id="tab-pages" class="tab" data-i18n="tabPages">Pages</button>
  </nav>

  <div class="topbar-tools" id="topbar-tools" hidden>
    <div class="topbar-view" id="topbar-view">
      <select id="view-mode" data-i18n-title="viewModeTitle" title="Page view">
        <option value="continuous" data-i18n="viewContinuous">Continuous</option>
        <option value="single" data-i18n="viewSingle">Single page</option>
        <option value="double" data-i18n="viewDouble">Double page</option>
      </select>
      <span class="zoom-group">
        <button id="zoom-out" data-i18n-title="zoomOutTitle" title="Zoom out">−</button>
        <button id="zoom-level" data-i18n-title="zoomResetTitle" title="Reset zoom to 100%">100%</button>
        <button id="zoom-in" data-i18n-title="zoomInTitle" title="Zoom in">+</button>
      </span>
      <span id="page-nav" hidden>
        <button id="page-prev" data-i18n-title="pagePrevTitle" title="Previous page">‹</button>
        <span id="page-indicator">1 / 1</span>
        <button id="page-next" data-i18n-title="pageNextTitle" title="Next page">›</button>
      </span>
    </div>
    <span class="topbar-compress" id="topbar-compress">
      <select id="compress-level" class="compress-field" data-i18n-title="compressTitle" title="Output size / quality">
        <option value="none" data-i18n="compressNone">Original quality</option>
        <option value="low" data-i18n="compressLow">Compress — high quality</option>
        <option value="medium" data-i18n="compressMedium">Compress — balanced</option>
        <option value="high" data-i18n="compressHigh">Compress — smallest</option>
      </select>
      <span id="compress-estimate" class="compress-estimate"></span>
    </span>
  </div>

  <div class="topbar-spacer"></div>

  <div class="topbar-actions" id="topbar-actions" hidden>
    <button id="btn-export" class="primary" data-i18n="btnExport" data-i18n-title="btnExportTitle" title="Download the modified PDF">Save PDF</button>
    <button id="btn-print" data-i18n="btnPrint" data-i18n-title="btnPrintTitle" title="Print the document">Print</button>
  </div>
</header>

<div id="workspace">
<aside id="sidebar" hidden>
  <section class="side-sec" id="sec-file">
    <button class="side-head" aria-expanded="true" data-i18n="secFile">File</button>
    <div class="side-body">
      <button id="btn-upload" data-i18n="btnUpload" data-i18n-title="btnUploadTitle" title="Open a PDF or image in a new tab">Open</button>
    </div>
  </section>

  <section class="side-sec" id="edit-tools">
    <button class="side-head" aria-expanded="true" data-i18n="secInsert">Insert</button>
    <div class="side-body">
      <button id="btn-add-text" data-i18n="btnAddText" data-i18n-title="btnAddTextTitle" title="Add a text box (click a page to place)">+ Text</button>
      <button id="btn-add-image" data-i18n="btnAddImage" data-i18n-title="btnAddImageTitle" title="Insert an image (click a page to place)">+ Image</button>
      <button id="btn-add-signature" data-i18n="btnAddSignature" data-i18n-title="btnAddSignatureTitle" title="Draw or upload a signature">+ Signature</button>
      <button id="btn-add-highlight" data-i18n="btnAddHighlight" data-i18n-title="btnAddHighlightTitle" title="Highlight part of a page (drag to draw)">+ Highlight</button>
      
    </div>
  </section>

  <section class="side-sec" id="ocr-tools">
    <button class="side-head" aria-expanded="false" data-i18n="secRecognize">Recognize text</button>
    <div class="side-body" hidden>
      <div class="menu-label" data-i18n="ocrMenuScope">What to recognize</div>
      <button id="mi-ocr-page" data-i18n="ocrScopePage">Whole page</button>
      <button id="mi-ocr-area" data-i18n="ocrScopeArea">Select an area…</button>
      <div class="menu-label" data-i18n="ocrMenuLang">Language</div>
      <label class="menu-radio"><input type="radio" name="ocr-lang" value="auto" checked><span data-i18n="ocrLangAuto">Auto (Khmer + English)</span></label>
      <label class="menu-radio"><input type="radio" name="ocr-lang" value="khm"><span data-i18n="ocrLangKhmer">Khmer</span></label>
      <label class="menu-radio"><input type="radio" name="ocr-lang" value="eng"><span data-i18n="ocrLangEnglish">English</span></label>
      <label class="menu-radio"><input type="radio" name="ocr-lang" value="math"><span data-i18n="ocrLangMath">Math / formulas</span></label>
      <div class="menu-note" data-i18n="ocrMathNote">Math mode rebuilds superscripts and fractions, and shows rendered formulas plus LaTeX.</div>
    </div>
  </section>

  <section class="side-sec" id="pages-tools" hidden>
    <button class="side-head" aria-expanded="true" data-i18n="secPages">Pages</button>
    <div class="side-body">
      <button id="btn-append-pdf" data-i18n="btnAppendPdf" data-i18n-title="btnAppendPdfTitle" title="Append pages from another PDF">+ Append PDF</button>
      <button id="btn-remove-pages" data-i18n="removeSelected" data-i18n-title="removeSelectedTitle" title="Remove selected pages" disabled>Remove selected</button>
      <div class="menu-label" data-i18n="splitMenuLabel">Split document (select one page)</div>
      <button id="btn-split-before" data-i18n="btnSplitBefore" data-i18n-title="btnSplitBeforeTitle" title="Split so the selected page starts the second document" disabled>Split before selected page</button>
      <button id="btn-split-after" data-i18n="btnSplitAfter" data-i18n-title="btnSplitAfterTitle" title="Split so the selected page ends the first document" disabled>Split after selected page</button>
      <div class="menu-label" data-i18n="compressLabelSidebar">Output size</div>
      <span id="pages-compress-anchor"></span>
    </div>
  </section>

  <a id="btn-features" class="side-bottom-btn" href="features.html" target="_blank" rel="noopener" data-i18n="btnFeatures" data-i18n-title="btnFeaturesTitle" title="See what this app can do (opens in a pop-up window)">✨ Features</a>
</aside>

<div id="content-col">
  <nav id="doc-tabs" hidden></nav>
  <main id="main">
    <div id="dropzone">
      <div class="dz-inner">
        <p class="dz-title" data-i18n="dzTitle">Drop a PDF or image here</p>
        <p class="dz-sub" data-i18n="dzOr">or</p>
        <button id="btn-pick" data-i18n="btnPick">Choose a file</button>
      </div>
    </div>
    <div id="hint-bar" hidden></div>
    <div id="edit-view" hidden></div>
    <div id="pages-view" hidden></div>
  </main>
</div>
</div>

<input type="file" id="file-input" accept="application/pdf,.pdf,image/png,image/jpeg,image/webp" multiple hidden>
<input type="file" id="append-input" accept="application/pdf,.pdf" hidden>
<input type="file" id="image-input" accept="image/png,image/jpeg" hidden>
<input type="file" id="sig-upload-input" accept="image/png" hidden>

<div id="sig-modal" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <span data-i18n="sigModalTitle">Signature</span>
      <button class="modal-close" data-close="sig-modal">&times;</button>
    </div>
    <div id="sig-styles" data-i18n-title="sigStylesTitle" title="Brush style — pressure from a stylus or touch varies the stroke width">
      <button type="button" class="tab active" data-style="pen" data-i18n="sigStylePen">Pen</button>
      <button type="button" class="tab" data-style="ink" data-i18n="sigStyleInk">Ink</button>
      <button type="button" class="tab" data-style="stylo" data-i18n="sigStyleStylo">Stylus</button>
      <button type="button" class="tab" data-style="marker" data-i18n="sigStyleMarker">Marker</button>
      <button type="button" class="tab" data-style="brush" data-i18n="sigStyleBrush">Brush</button>
    </div>
    <canvas id="sig-canvas" width="500" height="200"></canvas>
    <div class="modal-actions">
      <button id="sig-clear" data-i18n="sigClear">Clear</button>
      <button id="sig-upload" data-i18n="sigUpload">Upload PNG instead</button>
      <button id="sig-use" class="primary" data-i18n="sigUse">Use signature</button>
    </div>
  </div>
</div>

<div id="ocr-modal" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <span id="ocr-modal-title" data-i18n="ocrModalTitle">Recognized text (Khmer)</span>
      <button class="modal-close" data-close="ocr-modal">&times;</button>
    </div>
    <div id="ocr-progress" hidden><div id="ocr-progress-bar"></div><span id="ocr-progress-label">Starting…</span></div>
    <div id="ocr-views" hidden>
      <button class="ocr-view-tab active" data-view="rendered" data-i18n="ocrViewRendered">Rendered</button>
      <button class="ocr-view-tab" data-view="latex" data-i18n="ocrViewLatex">LaTeX</button>
      <button class="ocr-view-tab" data-view="text" data-i18n="ocrViewText">Plain text</button>
    </div>
    <div id="ocr-rendered" hidden></div>
    <textarea id="ocr-output" spellcheck="false" data-i18n-placeholder="ocrPlaceholder" placeholder="Recognized text will appear here."></textarea>
    <div class="modal-actions">
      <button id="ocr-copy" data-i18n="ocrCopy">Copy text</button>
    </div>
  </div>
</div>

</div>

<div id="busy" hidden><div class="spinner"></div><span id="busy-label">Working…</span></div>

<script src="vendor/pdf.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/tesseract.min.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
